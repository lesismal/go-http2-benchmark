[package]
name = "benchcli-rust-reqwest"
version = "0.1.0"
edition = "2021"
description = "HTTP/2 (h2c) benchmark client for go-http2-benchmark, built on reqwest"
publish = false

[[bin]]
name = "benchcli-rust-reqwest"
path = "src/main.rs"

[dependencies]
benchcli-rust-common = { path = "../benchcli-rust-common" }
# HTTP/2 only, in cleartext: no TLS, no compression, no system proxy lookup
# beyond what no_proxy() turns off at runtime.
reqwest = { version = "0.13", default-features = false, features = ["http2"] }
bytes = "1"
