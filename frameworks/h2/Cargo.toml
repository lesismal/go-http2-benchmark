[package]
name = "h2-server"
version = "0.1.0"
edition = "2021"
description = "go-http2-benchmark's h2 framework: an echo server on hyperium/h2"
publish = false

[[bin]]
name = "h2-server"
path = "src/main.rs"

[dependencies]
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
libc = "0.2"
