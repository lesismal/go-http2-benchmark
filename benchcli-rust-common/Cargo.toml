[package]
name = "benchcli-rust-common"
version = "0.1.0"
edition = "2021"
description = "What go-http2-benchmark's Rust clients share: flags, benchmarks, statistics and report files"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Only for the control requests (/init, /ps, pprof), which go over HTTP/1 on
# a port of their own; the benchmarks run on each client's own Conn. No TLS,
# no compression, no system proxy lookup beyond what no_proxy() turns off at
# runtime.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
